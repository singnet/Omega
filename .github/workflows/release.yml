name: release

on:
  release:
    types: [published]

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-tag
    uses: ./.github/workflows/common.yml
    with:
      publish_docker: true
      tag_name: ${{ needs.resolve-tag.outputs.sha }}
      checkout_ref: ${{ github.event.release.tag_name }}
      move_latest: false
    secrets: inherit

  qa-approval:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: dockerhub-production

    steps:
      - name: QA approval
        run: echo "QA approval received"

  admin-approval:
    needs: qa-approval
    runs-on: ubuntu-latest

    environment:
      name: dockerhub-admin-approval

    steps:
      - name: Admin approval
        run: echo "Admin approval received"

  update-tags:
    needs: [admin-approval, resolve-tag]
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Update release tags
        run: |
          docker buildx imagetools create \
            -t singularitynet/omega:${{ github.event.release.tag_name }} \
            -t singularitynet/omega:latest \
            singularitynet/omega:${{ needs.resolve-tag.outputs.sha }}
