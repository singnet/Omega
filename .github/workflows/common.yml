name: common

# Multi-platform Docker build example:
# https://docs.docker.com/build/ci/github-actions/multi-platform/

on:
  workflow_call:
    inputs:
      publish_docker:
        description: 'Publish Docker images to Docker Hub'
        required: false
        default: false
        type: boolean
      tag_name:
        description: 'Tag to publish'
        required: false
        default: 'latest'
        type: string
      move_latest:
        description: 'Move latest version to the new one'
        required: false
        default: false
        type: boolean
      no_build_cache:
        description: 'Do not use cached docker layers on image build'
        required: false
        default: false
        type: boolean
      platforms:
        description: 'Comma separated list of platforms to be built'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string
      run_tests:
        description: 'Run tests'
        required: false
        default: true
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      CICD_GITHUB_PAT:
        required: false

jobs:
  autotests:
    if: inputs.run_tests
    uses: ./.github/workflows/autotests.yml
    with:
      platforms: ${{ inputs.platforms }}
      no_build_cache: ${{ inputs.no_build_cache }}
    secrets: inherit

  common:
    needs: autotests
    if: always() && (needs.autotests.result == 'success' || needs.autotests.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Login to Docker Hub
        if: inputs.publish_docker
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (release)
        id: push
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.publish_docker }}
          tags: |
            singularitynet/omega:${{ inputs.tag_name }}
            ${{ inputs.move_latest && 'singularitynet/omega:latest' || '' }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=min
          no-cache: ${{ inputs.no_build_cache }}

      # Docker Hub occasionally returns a transient 400 on the large layer's blob PUT; retry the push once.
      - name: Build and push (release, retry)
        if: inputs.publish_docker && steps.push.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.publish_docker }}
          tags: |
            singularitynet/omega:${{ inputs.tag_name }}
            ${{ inputs.move_latest && 'singularitynet/omega:latest' || '' }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=min
          no-cache: ${{ inputs.no_build_cache }}
