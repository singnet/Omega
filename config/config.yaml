# General

# Turns the agent keeps running after a new human message before idling (seconds) 
maxNewInputLoops: 50
# Extra turns granted on each scheduled wake-up
maxWakeLoops: 1
# (deprecated)
spamShield: False
# Put HISTORY before LAST_SKILL_USE_RESULTS in the prompt so providers can reuse more of the cached prefix
stableContextOrder: False
# Delay between loop iterations (seconds)
sleepInterval: 1
# LLM model to load overrides *_model parameters see below
#model: 
# LLM provider id, see the list below in the Providers section
provider: Anthropic
# Output cap passed to the provider
maxOutputToken: 6000
# Reasoning-effort hint passed to the provider
reasoningMode: medium
# How long idle before the next scheduled wake-up (seconds)
wakeupInterval: 600
# Path to the logger configuration file
# See https://docs.python.org/3/library/logging.config.html#configuration-file-format
logConfigPath: ""
# Directory containing persistent memory files such as history.metta.
memoryDirectory: "./repos/Omega/memory"

# Memory

# Ceiling on `LAST_SKILL_USE_RESULTS` text fed back into the prompt (chars)
maxFeedback: 50000
# Items returned by `query`
maxRecallItems: 20
# Lines returned by `episodes`
maxEpisodeRecallLines: 20
# Tail of `memory/history.metta` included in the prompt (chars)
maxHistory: 30000
# ChromaDB persistence directory used for long-term memory portability.
chromaDbPath: "./chroma_db"
# `Local` (Python-side model) or `OpenAI` (requires `OPENAI_API_KEY`)
embeddingprovider: Local
# Enable authenticated operator-triggered /memory-export commands (disabled by default).
memoryExportEnabled: false

# Policy

# Path to the security profile written using [OpenShell YAML](https://docs.nvidia.com/openshell/reference/policy-schema#filesystem-policy). See [./profile/policy.yaml](./profile/policy.yaml) as an example. Empty value disables restrictions.
securityPolicyPath: "./repos/Omega/profile/policy.yaml"
# (internal) URL to the Nginx proxy isolating API keys from agent
#GATEWAY_URL:

# Channels

# Identifier of the communication channel for agent to use
# see the list below
commchannel: irc

# IRC
# Enabled with commchannel: irc
# IRC channel to join 
IRC_channel: "##omega"
# IRC server hostname
IRC_server: "irc.quakenet.org"
# IRC port
IRC_port: 6667
# IRC nickname
IRC_user: "omega"

# Mattermost
# Enabled with commchannel: mattermost
# Mattermost base URL.
MM_URL: "https://chat.singularitynet.io"
# Mattermost channel ID.
MM_CHANNEL_ID: "8fjrmabjx7gupy7e5kjznpt5qh"

# Slack
# Enabled with commchannel: slack
# Slack channel ID (for example `C0123456789`). If empty, Omega auto-binds on first successful auth message.
SL_CHANNEL_ID: ""
# Slack polling interval in seconds (minimum effective value is 60).
SL_POLL_INTERVAL: 60
# Slack maximum attachment size to download, in MB.
SL_MAX_FILE_SIZE_MB: 5

# Telegram
# Enabled with commchannel: telegram
# Legacy single-chat allowlist. When set, only this chat is accepted.
TG_CHAT_ID: ""
# Optional additional comma-separated chat IDs. These are a hard
# administrator boundary. With authentication enabled, the owner can still
# bootstrap and use their private DM.
TG_ALLOWED_CHAT_IDS: ""
# Telegram polling timeout in seconds.
TG_POLL_TIMEOUT: 20

# Websocket
# Enabled with commchannel: websocket
# WebSocket endpoint URL (`ws://` or `wss://`). Required when `commchannel=websocket`.
WS_URL: ""
# Optional bearer token sent as `Authorization: Bearer <token>`.
WS_TOKEN: ""

# Mock channel
# Enabled with commchannel: test

# Providers

# OpenAIAPI
# Enabled with provider: OpenAIAPI
# Name of the API key variable to read
api_token_var: "OPENAIAPI_API_KEY"
# LLM endpoint URL.
openaiapi_url: "http://localhost:11434/v1/"
# Default model
openaiapi_model: "qwen3.5:9b"

# ASICloud
# Enabled with provider: ASICloud
# Default model
asicloud_model: "minimax/minimax-m3"

# Anthropic
# Enabled with provider: Anthropic
# Default model
anthropic_model: "claude-opus-4-8"

# OpenRouter
# Enabled with provider: OpenRouter
# Default model
openrouter_model: "z-ai/glm-5.2"
# Overrides session id
#OPENROUTER_SESSION_ID:
# Cache TTL
OPENROUTER_CACHE_TTL: 5m

# OpenAI
# Enabled with provider: OpenAI
# Default model
openai_model: "gpt-5.5"
# Overrides prompt cache key
#OPENAI_PROMPT_CACHE_KEY:

# ASIOne
# Enabled with provider: ASIOne
# Default model
asione_model: "asi1-ultra"

# Mock provider
# Enabled with provider: Test

# Skills

# Plugins

# Workflow
# Path to the directory which contains available workflows. Default value is
# <project_root>/plugins/workflow/instructions. See plugins/workflow/README.md
# for details.
#pluginWorkflowInstructionsDir: ./plugins/workflow/instructions
# Path to the directory to keep workflow working files when workflow is active.
# Default value is <memoryDirectory>/workflow_space
#pluginWorkflowMemoryDir: ./memory/workflow_space

# OpenClaw
openClawEnabled: disabled
# In Docker, openClawURL is only a fallback: the real Gateway target and its
# token are set at container start (openclaw_url=, OMEGA_OPENCLAW_TOKEN)
# and injected by the local Nginx proxy, so the agent never sees the token.
# See plugins/openclaw/README.md.
openClawURL: "http://172.17.0.1:18789"
openClawAgent: "main"
